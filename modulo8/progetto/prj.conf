# Progetto finale: nodo di monitoraggio
# Configurazione di partenza. Ogni passo (modulo8/0N_*.md) dice quali opzioni aggiungere.
# Bus I2C, sensore (sensor API) e shell arrivano gia' da comune/sensore_sim.conf.

# LED e pulsante
CONFIG_GPIO=y

# Logging
CONFIG_LOG=y

# Nomi dei thread (utili in log, shell e thread analyzer)
CONFIG_THREAD_NAME=y
