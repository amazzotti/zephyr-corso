# Nomi dei thread (compaiono nel report del thread analyzer).
CONFIG_THREAD_NAME=y

# Thread analyzer: misura quanto stack ha usato ogni thread.
CONFIG_THREAD_ANALYZER=y
# ...e stampa il report con printk.
CONFIG_THREAD_ANALYZER_USE_PRINTK=y

# Rilevamento software dello stack overflow: un valore "sentinella" in fondo a ogni
# stack, ricontrollato a ogni cambio di contesto.
CONFIG_STACK_SENTINEL=y

# Spegniamo la protezione hardware (MPU): in Renode il suo modello non e' garantito.
# Sulla scheda vera conviene lasciarla attiva (e' il default).
CONFIG_HW_STACK_PROTECTION=n
