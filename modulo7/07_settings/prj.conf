# Esercizio modulo7/07_settings

# Driver di flash e flash simulata (vedi app.overlay)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_SIMULATOR=y

# NVS: file system chiave-valore adatto alla flash
CONFIG_NVS=y

# Settings, salvati con NVS
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
