# Esercizio modulo7/06_memoria

# I thread hanno un nome (compare nel rapporto dell'analyzer)
CONFIG_THREAD_NAME=y
# Thread analyzer: misura l'uso dello stack di ogni thread
CONFIG_THREAD_ANALYZER=y
# ... stampa con printk (senza bisogno del logging)
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
# ... da solo, ogni 5 secondi
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5
# Riempie gli stack di un valore noto all'avvio: serve per misurare quanto ne viene usato
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
